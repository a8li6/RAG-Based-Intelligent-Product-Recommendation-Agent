[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-product-recommendation-agent"
version = "0.1.0"
description = "RAG-Based Intelligent Product Recommendation Agent: hard-constraint filtering, FAISS semantic retrieval, and grounded explanations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "streamlit",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Optional, never required: neural embeddings (one-time model download).
neural = ["sentence-transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests needing a real embedding model or local LLM"]
filterwarnings = [
    # Upstream notice from starlette's TestClient about httpx; not an issue in this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Data-authoring scripts keep their input tables as dict(...) calls for readability.
"scripts/*" = ["C408"]
